name: Build Charge Alert APK

on:
  push:
    paths:
      - "ChargeAlert/**"
      - ".github/workflows/charge-alert.yml"
  pull_request:
    paths:
      - "ChargeAlert/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChargeAlert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: charge-alert-debug-apk
          path: ChargeAlert/app/build/outputs/apk/debug/app-debug.apk
